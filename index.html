<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Slot Roguelike</title>
    <style>
        /* Responsive Layout */
        body { 
            background-color: #121212; color: #e0e0e0; font-family: 'Segoe UI', sans-serif; 
            display: flex; flex-direction: row; flex-wrap: wrap; justify-content: center; 
            padding: 20px 10px; margin: 0; gap: 20px; 
        }

        #inventory-sidebar { 
            width: 180px; background: #1e1e1e; padding: 20px; border-radius: 20px; 
            border: 2px solid #333; height: fit-content; box-sizing: border-box;
        }

        #game-container { 
            background: #1e1e1e; padding: 20px; border-radius: 24px; border: 4px solid #333; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.8); text-align: center; 
            width: 100%; max-width: 420px; position: relative; box-sizing: border-box;
        }

        /* Mobile Adjustments */
        @media (max-width: 600px) {
            body { flex-direction: column; align-items: center; }
            #inventory-sidebar { order: 2; width: 100%; max-width: 420px; }
            #game-container { order: 1; }
        }

        .stats-bar { display: flex; justify-content: space-between; margin-bottom: 15px; }
        .gold-total { font-size: 1.4rem; font-weight: bold; color: #f1c40f; }
        
        .safe-container { 
            background: #2c3e50; padding: 12px; border-radius: 15px; margin-bottom: 20px; 
            border: 1px solid #34495e; display: flex; align-items: center; justify-content: space-between; 
        }
        .safe-btn { 
            background: #3498db; color: white; border: none; width: 40px; height: 40px; 
            border-radius: 10px; cursor: pointer; font-size: 1.2rem;
        }

        .slot-machine { 
            background: #000; padding: 15px; border-radius: 15px; margin-bottom: 20px; 
            border: 2px solid #444; display: flex; gap: 8px; justify-content: center; 
        }
        .reel { 
            width: 30%; max-width: 100px; aspect-ratio: 1/1; overflow: hidden; 
            background: white; border-radius: 12px; position: relative;
        }
        .symbol { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 2.2rem; }

        #spin-btn { 
            padding: 20px; font-size: 1.4rem; background: #e74c3c; color: white; border: none; 
            border-radius: 15px; cursor: pointer; width: 100%; font-weight: bold; 
            box-shadow: 0 6px #c0392b; -webkit-tap-highlight-color: transparent;
        }
        #spin-btn:disabled { background: #444; box-shadow: none; opacity: 0.6; }

        .overlay { 
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.97); border-radius: 20px; flex-direction: column; 
            align-items: center; justify-content: center; z-index: 100; padding: 20px; box-sizing: border-box;
        }

        .forfeit-btn {
            margin-top: 15px; background: transparent; color: #666; border: 1px solid #333;
            padding: 8px; border-radius: 8px; cursor: pointer; width: 100%; font-size: 0.7rem;
        }
    </style>
</head>
<body>

    <div id="inventory-sidebar">
        <div style="font-size: 0.8rem; color: #888; margin-bottom: 10px;">DECK</div>
        <div id="inv-list"></div>
        <div style="margin-top: 20px; border-top: 1px solid #333; padding-top: 10px;">
            <div style="color:#f1c40f; font-size: 0.8rem;">LUCK SHARDS: <span id="shard-display">✧ 0</span></div>
        </div>
        <button class="forfeit-btn" onclick="confirmForfeit()">FORFEIT RUN</button>
    </div>

    <div id="game-container">
        <div id="shop-overlay" class="overlay">
            <h2 style="color: #f1c40f;">SHOP</h2>
            <div id="shop-options" style="display:flex; gap:10px; flex-wrap:wrap; justify-content:center;"></div>
            <button onclick="rerollShop()" style="margin-top:20px; padding:10px 20px; background:#f1c40f; border:none; border-radius:8px;">REROLL (1G)</button>
        </div>

        <div id="rent-overlay" class="overlay">
            <h2 style="color: #3498db;">RENT DUE</h2>
            <p id="rent-bill-text" style="font-size: 1.2rem;"></p>
            <button id="pay-rent-btn" style="padding: 15px 40px; background: #2ecc71; color: white; border: none; border-radius: 12px; font-weight: bold;">PAY NOW</button>
        </div>

        <div id="game-over-overlay" class="overlay">
            <h1 id="death-title">RUN ENDED</h1>
            <p id="shard-earned-msg" style="color: #f1c40f;"></p>
            <button onclick="resetRun()" style="padding: 15px 40px; background: white; color: black; border: none; border-radius: 50px; font-weight: bold;">START NEW RUN</button>
        </div>

        <div id="win-msg" style="height:30px; font-weight:bold; color:#2ecc71;"></div>

        <div class="stats-bar">
            <div><small style="color:#888;">GOLD</small><br><span id="gold-display" class="gold-total">0</span></div>
            <div style="text-align:right;"><small style="color:#888;">RENT IN</small><br><span id="rent-counter" style="color:#e74c3c; font-weight:bold;">0</span></div>
        </div>

        <div class="safe-container">
            <button class="safe-btn" onclick="adjustSafe(-1)">−</button>
            <div style="text-align:center">
                <small style="color:#aaa; font-size:0.6rem;">SAFE</small><br>
                <span class="safe-amount" id="safe-display">0G</span>
            </div>
            <button class="safe-btn" onclick="adjustSafe(1)">+</button>
        </div>

        <div class="slot-machine">
            <div class="reel" id="reel-0"><div class="symbols-container"></div></div>
            <div class="reel" id="reel-1"><div class="symbols-container"></div></div>
            <div class="reel" id="reel-2"><div class="symbols-container"></div></div>
        </div>

        <button id="spin-btn" onclick="spin()">SPIN (1G)</button>
    </div>

    <script>
        let meta = JSON.parse(localStorage.getItem('cloverPit_META')) || { shards: 0, starterLvl: 0 };
        const INITIAL_STATE = () => ({
            gold: 15 + (meta.starterLvl * 5),
            safeGold: 0,
            spinsUntilShop: 5,
            spinsUntilRent: 10,
            rentDue: 10,
            totalGained: 0,
            lastResult: ['🍀', '🍎', '🍒'],
            playerDeck: ['🍀', '🍎', '🍒', '🪙', '💀', '💀']
        });

        let game = {};

        function vibrate(type) {
            if (navigator.vibrate) {
                if (type === 'win') navigator.vibrate([50, 30, 50]);
                if (type === 'loss') navigator.vibrate(100);
            }
        }

        function save() {
            localStorage.setItem('cloverPit_V10', JSON.stringify(game));
            localStorage.setItem('cloverPit_META', JSON.stringify(meta));
        }

        function load() {
            const saved = localStorage.getItem('cloverPit_V10');
            game = saved ? JSON.parse(saved) : INITIAL_STATE();
            updateUI();
            fillReels();
            checkBankruptcy(); // Safety check on load
        }

        function fillReels() {
            document.querySelectorAll('.symbols-container').forEach((container, i) => {
                container.innerHTML = `<div class="symbol">${game.lastResult[i]}</div>`;
                for (let j = 0; j < 40; j++) {
                    const s = document.createElement('div');
                    s.className = 'symbol';
                    s.textContent = game.playerDeck[Math.floor(Math.random() * game.playerDeck.length)];
                    container.appendChild(s);
                }
                container.style.transition = 'none';
                container.style.transform = 'translateY(0)';
            });
        }

        async function spin() {
            if (game.gold <= 0) return;
            document.getElementById('spin-btn').disabled = true;
            
            game.gold--;
            game.spinsUntilShop--;
            game.spinsUntilRent--;
            updateUI();

            const res = await Promise.all([animate(0), animate(1), animate(2)]);
            game.lastResult = res;
            
            // Calculate win
            let win = 0;
            const skulls = res.filter(s => s === '💀').length;
            win -= (skulls * 2);
            if (res[0] === res[1] && res[1] === res[2] && res[0] !== '💀') win += 15;
            else if (res[0] === res[1] || res[1] === res[2] || res[0] === res[2]) {
                const match = (res[0] === res[1] || res[0] === res[2]) ? res[0] : res[1];
                if (match !== '💀') win += 2;
            }

            game.gold += win;
            if (win > 0) { game.totalGained += win; vibrate('win'); }
            if (win < 0) vibrate('loss');

            const msg = document.getElementById('win-msg');
            msg.innerHTML = win !== 0 ? (win > 0 ? `+${win}G` : `${win}G`) : "";
            msg.style.color = win > 0 ? "#2ecc71" : "#e74c3c";

            updateUI();
            save();

            // Sequence Logic
            if (game.gold < 0) {
                endRun("Bankrupt!");
            } else if (game.spinsUntilRent <= 0) {
                setTimeout(showRent, 500);
            } else if (game.spinsUntilShop <= 0) {
                setTimeout(showShop, 500);
            } else {
                if (game.gold === 0) {
                    endRun("Out of Gold!");
                } else {
                    document.getElementById('spin-btn').disabled = false;
                }
            }
        }

        function animate(i) {
            return new Promise(resolve => {
                const el = document.querySelector(`#reel-${i} .symbols-container`);
                const target = 30;
                el.style.transition = `transform ${1 + (i * 0.2)}s cubic-bezier(0.1, 0, 0.1, 1)`;
                el.style.transform = `translateY(-${target * 100}px)`;
                setTimeout(() => resolve(el.children[target].textContent), (1 + (i * 0.2)) * 1000);
            });
        }

        function showRent() {
            document.getElementById('rent-bill-text').textContent = `Pay ${game.rentDue}G or Game Over`;
            document.getElementById('rent-overlay').style.display = 'flex';
            document.getElementById('pay-rent-btn').onclick = () => {
                if ((game.gold + game.safeGold) >= game.rentDue) {
                    let bill = game.rentDue;
                    const fromSafe = Math.min(game.safeGold, bill);
                    game.safeGold -= fromSafe;
                    game.gold -= (bill - fromSafe);
                    game.rentDue = Math.floor(game.rentDue * 1.5) + 5;
                    game.spinsUntilRent = 10;
                    document.getElementById('rent-overlay').style.display = 'none';
                    if (game.spinsUntilShop <= 0) showShop();
                    else checkBankruptcy();
                } else {
                    endRun("Can't pay rent!");
                }
            };
        }

        function showShop() {
            const box = document.getElementById('shop-options');
            box.innerHTML = '';
            const pool = ['💎', '7️⃣', '🌟', '🪙', '🍀', '🍎'];
            for(let i=0; i<3; i++) {
                const s = pool[Math.floor(Math.random()*pool.length)];
                const btn = document.createElement('button');
                btn.style.padding = '15px'; btn.style.borderRadius = '10px'; btn.innerHTML = s;
                btn.onclick = () => { game.playerDeck.push(s); closeShop(); };
                box.appendChild(btn);
            }
            document.getElementById('shop-overlay').style.display = 'flex';
        }

        function closeShop() {
            game.spinsUntilShop = 5;
            document.getElementById('shop-overlay').style.display = 'none';
            checkBankruptcy();
            fillReels();
        }

        function checkBankruptcy() {
            if (game.gold <= 0 && game.safeGold <= 0) {
                endRun("No gold left!");
            } else if (game.gold <= 0 && game.safeGold > 0) {
                // If they have safe gold but 0 wallet, they aren't dead, but need to move gold
                document.getElementById('win-msg').innerHTML = "Move gold from safe!";
                document.getElementById('win-msg').style.color = "#3498db";
                document.getElementById('spin-btn').disabled = true;
            } else {
                document.getElementById('spin-btn').disabled = false;
            }
            updateUI();
            save();
        }

        function endRun(reason) {
            const earned = Math.floor(game.totalGained / 10);
            meta.shards += earned;
            document.getElementById('death-title').textContent = reason;
            document.getElementById('shard-earned-msg').textContent = `✧${earned} Shards Earned`;
            document.getElementById('game-over-overlay').style.display = 'flex';
            save();
        }

        function confirmForfeit() {
            if (confirm("End run now? You will keep shards earned so far.")) endRun("Run Forfeited");
        }

        function resetRun() {
            game = INITIAL_STATE();
            document.getElementById('game-over-overlay').style.display = 'none';
            fillReels();
            updateUI();
            save();
            document.getElementById('spin-btn').disabled = false;
        }

        function adjustSafe(n) {
            if (n > 0 && game.gold >= 1) { game.gold--; game.safeGold++; }
            else if (n < 0 && game.safeGold >= 1) { game.gold++; game.safeGold--; }
            checkBankruptcy();
        }

        function updateUI() {
            document.getElementById('gold-display').textContent = game.gold + "G";
            document.getElementById('safe-display').textContent = game.safeGold + "G";
            document.getElementById('shard-display').textContent = `✧ ${meta.shards}`;
            document.getElementById('rent-counter').textContent = game.spinsUntilRent;
            const inv = document.getElementById('inv-list');
            inv.innerHTML = '';
            const counts = {};
            game.playerDeck.forEach(x => counts[x] = (counts[x] || 0) + 1);
            Object.keys(counts).forEach(s => {
                inv.innerHTML += `<div style="display:flex; justify-content:space-between; margin-bottom:4px; font-size:0.9rem;"><span>${s}</span><span>x${counts[s]}</span></div>`;
            });
        }

        load();
    </script>
</body>
</html>
